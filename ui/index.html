<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>PlanOS</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/syntax.js" defer></script>
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <div class="shell">
    <aside class="side" aria-label="Navigation">
      <a class="brand" href="#/">
        <img class="brand-mark" src="/assets/favicon.svg" alt="">
        <span>PlanOS</span>
      </a>
      <nav class="side-group">
        <a id="nav-all" class="toc-item" href="#/">
          <span class="toc-name">All plans</span>
          <span id="nav-waiting" class="tab-badge" hidden></span>
        </a>
      </nav>
      <div id="outline-group" class="side-group" hidden>
        <h2>Outline</h2>
        <nav id="toc" aria-label="Outline"></nav>
      </div>
      <div class="side-foot">
        <span id="status-dot" class="status-dot"></span>
        <span id="status">Connecting…</span>
        <span class="spacer"></span>
        <button id="theme" class="icon-btn" title="Switch light and dark" aria-label="Switch light and dark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
        </button>
      </div>
    </aside>

    <div id="main" class="main"><div class="loading">Loading…</div></div>
  </div>

  <footer id="decide" class="decide" aria-label="Decision" hidden>
    <div class="decide-inner">
      <textarea id="general" rows="1" placeholder="Overall note for Claude (optional)"></textarea>
      <div class="actions">
        <span id="decide-note" class="help"></span>
        <button id="terminal" class="btn ghost" title="Close this review and answer in Claude Code's own dialog">Answer in terminal</button>
        <button id="changes" class="btn" disabled>Request changes <span id="count" class="tab-badge" hidden></span></button>
        <div id="approve-group" class="approve-group">
          <div class="segmented" role="radiogroup" aria-label="Mode after approval">
            <button data-mode="default" aria-pressed="true" title="Claude asks before each edit">Manual</button>
            <button data-mode="acceptEdits" aria-pressed="false" title="Claude edits files without asking">Accept edits</button>
            <button data-mode="auto" aria-pressed="false" title="Claude works without asking, with safety checks">Auto</button>
          </div>
          <button id="approve" class="btn primary">Approve plan</button>
        </div>
      </div>
    </div>
  </footer>

  <button id="selbtn" class="selbtn" hidden>Comment <kbd>C</kbd></button>
  <button id="gutter" class="gutter" hidden aria-label="Comment on this block">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg>
  </button>
  <div id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
